<div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-2xl font-semibold">Companies</h2>
    <div>
      <button class="btn btn-outline-secondary" id="refreshCompanies">Refresh</button>
      <button class="btn btn-primary" id="newCompanyBtn">New Company</button>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-sm">
          <thead>
            <tr>
              <th>Name</th>
              <th>Industry</th>
              <th>Website</th>
              <th>Phone</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="companiesTableBody"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <div>Page <span id="companiesPage">1</span> | Total: <span id="companiesTotalCount">0</span></div>
        <div>
          <button class="btn btn-sm btn-outline-secondary" id="prevPageComp">Prev</button>
          <button class="btn btn-sm btn-outline-secondary" id="nextPageComp">Next</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="companyModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Company</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2"><input class="form-control" id="compName" placeholder="Company name *"></div>
        <div class="mb-2"><input class="form-control" id="compIndustry" placeholder="Industry"></div>
        <div class="mb-2"><input class="form-control" id="compWebsite" placeholder="Website"></div>
        <div class="mb-2"><input class="form-control" id="compPhone" placeholder="Phone"></div>
        <div class="mb-2"><textarea class="form-control" id="compAddress" placeholder="Address" rows="2"></textarea></div>
        <input type="hidden" id="compId" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveCompanyBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var page = 1; var pageSize = 10;
  function load(){
    google.script.run.withSuccessHandler(function(resp){
      document.getElementById('companiesPage').textContent = String(page);
      document.getElementById('companiesTotalCount').textContent = String(resp.total || 0);
      var tb = document.getElementById('companiesTableBody'); tb.innerHTML = '';
      (resp.rows || []).forEach(function(c){
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>'+(c.name||'')+'</td><td>'+(c.industry||'')+'</td><td>'+(c.website||'')+'</td><td>'+(c.phone||'')+'</td>'+
          '<td><button class="btn btn-sm btn-outline-primary edit-comp" data-id="'+(c.company_id||'')+'">Edit</button></td>';
        tb.appendChild(tr);
      });
      document.querySelectorAll('.edit-comp').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = this.getAttribute('data-id');
          google.script.run.withSuccessHandler(function(comp){
            if(comp){
              document.getElementById('compId').value = comp.company_id || '';
              document.getElementById('compName').value = comp.name || '';
              document.getElementById('compIndustry').value = comp.industry || '';
              document.getElementById('compWebsite').value = comp.website || '';
              document.getElementById('compPhone').value = comp.phone || '';
              document.getElementById('compAddress').value = comp.address || '';
              new bootstrap.Modal(document.getElementById('companyModal')).show();
            }
          }).getCompanyApi(id);
        });
      });
    }).listCompaniesApi({page: page, pageSize: pageSize});
  }
  document.getElementById('refreshCompanies').addEventListener('click', load);
  document.getElementById('prevPageComp').addEventListener('click', function(){ if(page>1){page--; load();}});
  document.getElementById('nextPageComp').addEventListener('click', function(){ page++; load(); });
  document.getElementById('newCompanyBtn').addEventListener('click', function(){
    document.getElementById('compId').value = '';
    document.getElementById('compName').value = '';
    document.getElementById('compIndustry').value = '';
    document.getElementById('compWebsite').value = '';
    document.getElementById('compPhone').value = '';
    document.getElementById('compAddress').value = '';
    new bootstrap.Modal(document.getElementById('companyModal')).show();
  });
  document.getElementById('saveCompanyBtn').addEventListener('click', function(){
    var obj = {
      company_id: document.getElementById('compId').value || undefined,
      name: document.getElementById('compName').value,
      industry: document.getElementById('compIndustry').value,
      website: document.getElementById('compWebsite').value,
      phone: document.getElementById('compPhone').value,
      address: document.getElementById('compAddress').value
    };
    google.script.run.withSuccessHandler(function(res){
      if(res.success){
        bootstrap.Modal.getInstance(document.getElementById('companyModal')).hide();
        load();
      } else {
        alert('Error: ' + (res.error || 'Unknown error'));
      }
    }).saveCompanyApi(obj);
  });
  load();
})();
</script>
