<div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-2xl font-semibold">Tasks</h2>
    <div>
      <button class="btn btn-outline-secondary" id="refreshTasks">Refresh</button>
      <button class="btn btn-primary" id="newTaskBtn">New Task</button>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-sm">
          <thead>
            <tr>
              <th>Subject</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Due Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tasksTableBody"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <div>Page <span id="tasksPage">1</span> | Total: <span id="tasksTotalCount">0</span></div>
        <div>
          <button class="btn btn-sm btn-outline-secondary" id="prevPageTask">Prev</button>
          <button class="btn btn-sm btn-outline-secondary" id="nextPageTask">Next</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2"><input class="form-control" id="taskSubject" placeholder="Subject *"></div>
        <div class="mb-2"><textarea class="form-control" id="taskDescription" placeholder="Description" rows="3"></textarea></div>
        <div class="mb-2">
          <select class="form-select" id="taskPriority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="mb-2">
          <select class="form-select" id="taskStatus">
            <option value="Pending" selected>Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div class="mb-2"><input type="date" class="form-control" id="taskDueDate" placeholder="Due date"></div>
        <input type="hidden" id="taskId" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveTaskBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var page = 1; var pageSize = 10;
  function load(){
    google.script.run.withSuccessHandler(function(resp){
      document.getElementById('tasksPage').textContent = String(page);
      document.getElementById('tasksTotalCount').textContent = String(resp.total || 0);
      var tb = document.getElementById('tasksTableBody'); tb.innerHTML = '';
      (resp.rows || []).forEach(function(t){
        var tr = document.createElement('tr');
        var priorityBadge = t.priority === 'High' ? 'badge bg-danger' : (t.priority === 'Medium' ? 'badge bg-warning' : 'badge bg-secondary');
        var statusBadge = t.status === 'Completed' ? 'badge bg-success' : (t.status === 'In Progress' ? 'badge bg-primary' : 'badge bg-secondary');
        tr.innerHTML = '<td>'+(t.subject||'')+'</td><td><span class="'+priorityBadge+'">'+(t.priority||'')+'</span></td><td><span class="'+statusBadge+'">'+(t.status||'')+'</span></td><td>'+(t.due_date||'')+'</td>'+
          '<td><button class="btn btn-sm btn-outline-primary edit-task" data-id="'+(t.task_id||'')+'">Edit</button></td>';
        tb.appendChild(tr);
      });
      document.querySelectorAll('.edit-task').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = this.getAttribute('data-id');
          google.script.run.withSuccessHandler(function(task){
            if(task){
              document.getElementById('taskId').value = task.task_id || '';
              document.getElementById('taskSubject').value = task.subject || '';
              document.getElementById('taskDescription').value = task.description || '';
              document.getElementById('taskPriority').value = task.priority || 'Medium';
              document.getElementById('taskStatus').value = task.status || 'Pending';
              document.getElementById('taskDueDate').value = task.due_date || '';
              new bootstrap.Modal(document.getElementById('taskModal')).show();
            }
          }).getTaskApi(id);
        });
      });
    }).listTasksApi({page: page, pageSize: pageSize});
  }
  document.getElementById('refreshTasks').addEventListener('click', load);
  document.getElementById('prevPageTask').addEventListener('click', function(){ if(page>1){page--; load();}});
  document.getElementById('nextPageTask').addEventListener('click', function(){ page++; load(); });
  document.getElementById('newTaskBtn').addEventListener('click', function(){
    document.getElementById('taskId').value = '';
    document.getElementById('taskSubject').value = '';
    document.getElementById('taskDescription').value = '';
    document.getElementById('taskPriority').value = 'Medium';
    document.getElementById('taskStatus').value = 'Pending';
    document.getElementById('taskDueDate').value = '';
    new bootstrap.Modal(document.getElementById('taskModal')).show();
  });
  document.getElementById('saveTaskBtn').addEventListener('click', function(){
    var obj = {
      task_id: document.getElementById('taskId').value || undefined,
      subject: document.getElementById('taskSubject').value,
      description: document.getElementById('taskDescription').value,
      priority: document.getElementById('taskPriority').value,
      status: document.getElementById('taskStatus').value,
      due_date: document.getElementById('taskDueDate').value
    };
    google.script.run.withSuccessHandler(function(res){
      if(res.success){
        bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
        load();
      } else {
        alert('Error: ' + (res.error || 'Unknown error'));
      }
    }).saveTaskApi(obj);
  });
  load();
})();
</script>
