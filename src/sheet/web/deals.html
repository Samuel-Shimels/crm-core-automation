<div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-2xl font-semibold">Deals</h2>
    <div>
      <button class="btn btn-outline-secondary" id="refreshDeals">Refresh</button>
      <button class="btn btn-primary" id="newDealBtn">New Deal</button>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-sm">
          <thead>
            <tr>
              <th>Title</th>
              <th>Stage</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Close Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="dealsTableBody"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <div>Page <span id="dealsPage">1</span> | Total: <span id="dealsTotalCount">0</span></div>
        <div>
          <button class="btn btn-sm btn-outline-secondary" id="prevPageDeal">Prev</button>
          <button class="btn btn-sm btn-outline-secondary" id="nextPageDeal">Next</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="dealModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Deal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2"><input class="form-control" id="dealTitle" placeholder="Deal title *"></div>
        <div class="mb-2">
          <select class="form-select" id="dealStage">
            <option value="Prospect">Prospect</option>
            <option value="Qualified">Qualified</option>
            <option value="Proposal">Proposal</option>
            <option value="Negotiation">Negotiation</option>
            <option value="Closed Won">Closed Won</option>
            <option value="Closed Lost">Closed Lost</option>
          </select>
        </div>
        <div class="mb-2"><input type="number" class="form-control" id="dealAmount" placeholder="Amount"></div>
        <div class="mb-2">
          <select class="form-select" id="dealStatus">
            <option value="Open">Open</option>
            <option value="Won">Won</option>
            <option value="Lost">Lost</option>
          </select>
        </div>
        <div class="mb-2"><input type="date" class="form-control" id="dealCloseDate" placeholder="Close date"></div>
        <input type="hidden" id="dealId" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveDealBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var page = 1; var pageSize = 10;
  function load(){
    google.script.run.withSuccessHandler(function(resp){
      document.getElementById('dealsPage').textContent = String(page);
      document.getElementById('dealsTotalCount').textContent = String(resp.total || 0);
      var tb = document.getElementById('dealsTableBody'); tb.innerHTML = '';
      (resp.rows || []).forEach(function(d){
        var tr = document.createElement('tr');
        var amount = d.amount ? (d.currency||'$') + Number(d.amount).toLocaleString() : '';
        var statusBadge = d.status === 'Open' ? 'badge bg-primary' : (d.status === 'Won' ? 'badge bg-success' : 'badge bg-secondary');
        tr.innerHTML = '<td>'+(d.title||'')+'</td><td>'+(d.stage||'')+'</td><td>'+amount+'</td><td><span class="'+statusBadge+'">'+(d.status||'')+'</span></td><td>'+(d.close_date||'')+'</td>'+
          '<td><button class="btn btn-sm btn-outline-primary edit-deal" data-id="'+(d.deal_id||'')+'">Edit</button></td>';
        tb.appendChild(tr);
      });
      document.querySelectorAll('.edit-deal').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = this.getAttribute('data-id');
          google.script.run.withSuccessHandler(function(deal){
            if(deal){
              document.getElementById('dealId').value = deal.deal_id || '';
              document.getElementById('dealTitle').value = deal.title || '';
              document.getElementById('dealStage').value = deal.stage || 'Prospect';
              document.getElementById('dealAmount').value = deal.amount || '';
              document.getElementById('dealStatus').value = deal.status || 'Open';
              document.getElementById('dealCloseDate').value = deal.close_date || '';
              new bootstrap.Modal(document.getElementById('dealModal')).show();
            }
          }).getDealApi(id);
        });
      });
    }).listDealsApi({page: page, pageSize: pageSize});
  }
  document.getElementById('refreshDeals').addEventListener('click', load);
  document.getElementById('prevPageDeal').addEventListener('click', function(){ if(page>1){page--; load();}});
  document.getElementById('nextPageDeal').addEventListener('click', function(){ page++; load(); });
  document.getElementById('newDealBtn').addEventListener('click', function(){
    document.getElementById('dealId').value = '';
    document.getElementById('dealTitle').value = '';
    document.getElementById('dealStage').value = 'Prospect';
    document.getElementById('dealAmount').value = '';
    document.getElementById('dealStatus').value = 'Open';
    document.getElementById('dealCloseDate').value = '';
    new bootstrap.Modal(document.getElementById('dealModal')).show();
  });
  document.getElementById('saveDealBtn').addEventListener('click', function(){
    var obj = {
      deal_id: document.getElementById('dealId').value || undefined,
      title: document.getElementById('dealTitle').value,
      stage: document.getElementById('dealStage').value,
      amount: document.getElementById('dealAmount').value,
      status: document.getElementById('dealStatus').value,
      close_date: document.getElementById('dealCloseDate').value
    };
    google.script.run.withSuccessHandler(function(res){
      if(res.success){
        bootstrap.Modal.getInstance(document.getElementById('dealModal')).hide();
        load();
      } else {
        alert('Error: ' + (res.error || 'Unknown error'));
      }
    }).saveDealApi(obj);
  });
  load();
})();
</script>
