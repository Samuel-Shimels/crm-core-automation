<script>
(function(){
  function runInlineScripts(container){
    var scripts = Array.prototype.slice.call(container.querySelectorAll('script'));
    scripts.forEach(function(old){
      var s = document.createElement('script');
      if (old.type) s.type = old.type;
      if (old.textContent) s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }
  function initView(page){
    if (page === 'dashboard') {
      var el = document.getElementById('dashInfo');
      if (el && google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(resp){ el.textContent = 'Contacts loaded: ' + (resp.total || 0); }).listContactsApi({page:1,pageSize:1});
      }
    }
    if (page === 'contacts') {
      var pageNum = 1; var pageSize = 10;
      function load(){
        if (!(google && google.script && google.script.run)) return;
        google.script.run.withSuccessHandler(function(resp){
          var pageEl = document.getElementById('contactsPage'); if (pageEl) pageEl.textContent = String(pageNum);
          var tb = document.getElementById('contactsTableBody'); if (!tb) return; tb.innerHTML='';
          (resp.rows||[]).forEach(function(c){
            var tr = document.createElement('tr');
            var name = ((c.first_name||'') + ' ' + (c.last_name||'')).trim();
            tr.innerHTML = '<td>'+name+'</td><td>'+(c.email||'')+'</td><td>'+(c.phone||'')+'</td>'+
              '<td><button class="btn btn-sm btn-outline-primary" data-id="'+(c.contact_id||'')+'">Edit</button></td>';
            tb.appendChild(tr);
          });
        }).listContactsApi({page: pageNum, pageSize: pageSize});
      }
      var refreshBtn = document.getElementById('refreshContacts'); if (refreshBtn) refreshBtn.onclick = load;
      var prevBtn = document.getElementById('prevPage'); if (prevBtn) prevBtn.onclick = function(){ if(pageNum>1){pageNum--; load();} };
      var nextBtn = document.getElementById('nextPage'); if (nextBtn) nextBtn.onclick = function(){ pageNum++; load(); };
      var newBtn = document.getElementById('newContactBtn'); if (newBtn) newBtn.onclick = function(){
        var m = document.getElementById('contactModal'); if (!m) return;
        ['cId','cFirst','cLast','cEmail','cPhone'].forEach(function(id){ var e=document.getElementById(id); if(e) e.value=''; });
        new bootstrap.Modal(m).show();
      };
      var saveBtn = document.getElementById('saveContactBtn'); if (saveBtn) saveBtn.onclick = function(){
        var obj = {
          contact_id: document.getElementById('cId') && document.getElementById('cId').value || undefined,
          first_name: document.getElementById('cFirst') && document.getElementById('cFirst').value || '',
          last_name: document.getElementById('cLast') && document.getElementById('cLast').value || '',
          email: document.getElementById('cEmail') && document.getElementById('cEmail').value || '',
          phone: document.getElementById('cPhone') && document.getElementById('cPhone').value || ''
        };
        if (!(google && google.script && google.script.run)) return;
        google.script.run.withSuccessHandler(function(){ var m=document.getElementById('contactModal'); if(m){ var inst=bootstrap.Modal.getInstance(m); if(inst) inst.hide(); } load(); }).saveContactApi(obj);
      };
      load();
    }
    if (page === 'companies') {
      var el = document.getElementById('companiesInfo');
      if (el && google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(resp){ el.textContent = 'Companies API OK (' + (resp.count||0) + ')'; }).pingCompaniesApi();
      }
    }
    if (page === 'deals') {
      var el = document.getElementById('dealsInfo');
      if (el && google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(resp){ el.textContent = 'Deals API OK (' + (resp.count||0) + ')'; }).pingDealsApi();
      }
    }
    if (page === 'tasks') {
      var el = document.getElementById('tasksInfo');
      if (el && google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(resp){ el.textContent = 'Tasks API OK (' + (resp.count||0) + ')'; }).pingTasksApi();
      }
    }
    if (page === 'email') {
      var el = document.getElementById('emailInfo');
      if (el && google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(resp){ el.textContent = 'Email API OK (' + (resp.count||0) + ')'; }).pingEmailApi();
      }
    }
    if (page === 'reports') {
      var el = document.getElementById('reportsInfo');
      if (el && google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(resp){ el.textContent = 'Reports API OK (' + (resp.count||0) + ')'; }).pingReportsApi();
      }
    }
    if (page === 'admin') {
      var initBtn = document.getElementById('initBtn'); if (initBtn) initBtn.onclick = function(){ if (google && google.script && google.script.run) { google.script.run.withSuccessHandler(function(){ alert('Initialized'); }).initCrmSheetsApi(); } };
    }
  }
  function setView(page){
    var container = document.getElementById('appView');
    var map = { dashboard: 'web/dashboard', contacts: 'web/contacts', companies: 'web/companies', deals: 'web/deals', tasks: 'web/tasks', email: 'web/email', reports: 'web/reports', admin: 'web/admin' };
    var file = map[page] || 'web/dashboard';
    if (!(google && google.script && google.script.run)) return;
    google.script.run.withSuccessHandler(function(html){
      container.innerHTML = html;
      runInlineScripts(container);
      initView(page);
    }).include_(file);
  }
  document.addEventListener('click', function(e){
    var link = e.target && e.target.closest && e.target.closest('[data-page]');
    if (link) { 
      e.preventDefault(); 
      var page = link.getAttribute('data-page');
      setView(page);
      // Update active nav state
      document.querySelectorAll('aside nav a').forEach(function(a){ a.classList.remove('active'); });
      link.classList.add('active');
    }
  });
  // Set initial view
  setView('dashboard');
  // Mark dashboard as active initially
  var dashLink = document.querySelector('[data-page="dashboard"]');
  if (dashLink) dashLink.classList.add('active');
  window.initCrmSheets = function(){ if (google && google.script && google.script.run) { google.script.run.withSuccessHandler(function(){ alert('Initialized.'); }).initCrmSheetsApi(); } };
})();
</script>
